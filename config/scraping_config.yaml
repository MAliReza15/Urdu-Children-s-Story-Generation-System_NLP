scraping:
  delay_between_requests: 2.5  # seconds
  max_retries: 3
  timeout: 30
  concurrent_requests: 1  # Start conservative
  
  user_agents:
    rotate: true
    pool_size: 10

sources:
  rekhta:
    base_url: "https://www.rekhta.org"
    target_stories: 200
    lang: "ur"
    selectors:
      # Author listings found via /stories page
      author_list: "a[href*='/authors/'], a[href*='/storywriter/']"
      # Story content on individual story pages
      title: "h1"
      content: "div.poemPageContentBody"
    
  bbc_urdu:
    base_url: "https://www.bbc.com/urdu"
    target_stories: 60
    topics:
      - "topics/cjgn7n9zzq7t"    # Pakistan
      - "topics/cl8l9mveql2t"     # Regional
      - "topics/ckdxnx900n5t"     # Entertainment
    selectors:
      story_list: "a[href*='/urdu/articles/']"
      title: "h1#content"
      content: "p[dir='rtl']"

  urdupoint:
    base_url: "https://www.urdupoint.com/stories/"
    target_stories: 100
    categories:
      - "moral-stories"
      - "romantic-stories"
      - "funny-stories"
    selectors:
      story_list: "div.story-item a"
      title: "h1.story-title"
      content: "div.story-content p"

  # DISABLED - domain is for sale (dead)
  # urdukahani:
  #   base_url: "https://urdukahani.com"
  #   target_stories: 140

  # DISABLED - DNS failure (site is down)
  # kitabonagri:
  #   base_url: "https://www.kitabonagri.com"
  #   target_stories: 80

validation:
  min_word_count: 100
  max_word_count: 5000
  min_urdu_percentage: 85.0
  max_duplicate_similarity: 0.95
  
logging:
  level: "INFO"
  save_to_file: true
  log_dir: "logs/"
